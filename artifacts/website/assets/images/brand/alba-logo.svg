<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 72" role="img" aria-label="AlbA Trading Co., Ltd">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#8B6914"/>
      <stop offset="30%"  stop-color="#C9A84C"/>
      <stop offset="55%"  stop-color="#E8C96B"/>
      <stop offset="75%"  stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#8B6914"/>
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#A8B4C4"/>
      <stop offset="50%"  stop-color="#C8D0DA"/>
      <stop offset="100%" stop-color="#A8B4C4"/>
    </linearGradient>
  </defs>

  <!-- Geometric A Mark (hexagonal frame) -->
  <polygon points="36,6 60,6 70,36 60,66 36,66 26,36" fill="none" stroke="url(#goldGrad)" stroke-width="1.8"/>
  <polygon points="36,12 58,12 66,36 58,60 36,60 28,36" fill="none" stroke="url(#goldGrad)" stroke-width="0.6" opacity="0.4"/>

  <!-- Bold A letterform inside mark -->
  <text x="48" y="52" text-anchor="middle"
    font-family="Barlow, Arial Black, sans-serif"
    font-weight="800"
    font-size="38"
    fill="url(#goldGrad)"
    letter-spacing="-1">A</text>

  <!-- Company Name -->
  <text x="88" y="34"
    font-family="Barlow, Arial Black, sans-serif"
    font-weight="800"
    font-size="26"
    fill="url(#goldGrad)"
    letter-spacing="1.5">AlbA</text>

  <!-- TRADING CO., LTD -->
  <text x="88" y="52"
    font-family="Barlow, Arial, sans-serif"
    font-weight="400"
    font-size="10"
    fill="url(#silverGrad)"
    letter-spacing="4">TRADING CO., LTD</text>

  <!-- Divider line -->
  <line x1="82" y1="12" x2="82" y2="60" stroke="url(#goldGrad)" stroke-width="1" opacity="0.5"/>
</svg>
