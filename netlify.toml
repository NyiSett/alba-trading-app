[build]
  # Netlify: set "Base directory" to "artifacts/website" in the dashboard,
  # OR deploy from the repo root using the settings below.
  base    = "artifacts/website"
  command = "npm install && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from   = "/pages/products/gi-hollow-pipe"
  to     = "/pages/products/gi-hollow-pipe.html"
  status = 200

[[redirects]]
  from   = "/pages/products/nexframe"
  to     = "/pages/products/nexframe.html"
  status = 200

[[redirects]]
  from   = "/pages/products/glass"
  to     = "/pages/products/glass.html"
  status = 200

[[redirects]]
  from   = "/pages/products/h-beam"
  to     = "/pages/products/h-beam.html"
  status = 200

[[redirects]]
  from   = "/pages/contact"
  to     = "/pages/contact.html"
  status = 200

[[redirects]]
  from   = "/*"
  to     = "/404.html"
  status = 404
